# Vercel Hobby only allows daily crons, so the 15-minute scheduler tick runs from here.
name: Scheduler tick

on:
  schedule:
    # Off the :00/:15 marks, which GitHub delays or drops most under load. Still best-effort: the webhook and
    # Inbox visits also tick (lib/tick.ts tickForEvents / tickForUser).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/tick
        run: |
          curl --fail-with-body -sS -m 240 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_URL || 'https://getshiplog.vercel.app' }}/api/cron/tick"
